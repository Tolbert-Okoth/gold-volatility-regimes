[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volregime"
version = "0.1.0"
description = "Volatility regimes, honestly: intraday descriptors, exact structural breaks, pre-registered state tests and volatility-forecaster shoot-outs (gold 2009-2026 atlas included)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]
keywords = ["volatility", "regime detection", "structural breaks", "GARCH", "gold", "XAUUSD", "quant", "time series"]

[project.optional-dependencies]
garch = ["arch>=6"]
plot = ["matplotlib>=3.7"]
all = ["arch>=6", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volregime = ["data/*.csv"]
